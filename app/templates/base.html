<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kanbanano{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# app.js and timer.js must run before Alpine so their alpine:init listeners are
     registered in time. #}
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/sortable.min.js" defer></script>
  <script src="/static/vendor/confetti.browser.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/timer.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body>
  {% block body %}{% endblock %}
  {% block timer %}{% include "_timer.html" %}{% endblock %}
  <div id="flash" role="alert" hidden></div>
</body>
</html>
