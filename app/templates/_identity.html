{# The header's "I am" picker and "Assigned to me" filter. State lives in
   localStorage (see the identity component in app.js), so re-rendering this
   out-of-band when people change loses nothing. #}
<div id="identity" class="identity" x-data="identity({{ board_id }})" {% if oob %}hx-swap-oob="true"{% endif %}>
  <label class="identity-picker">
    I am
    <select x-model="me" x-ref="select">
      <option value="">undercover</option>
      {% for person in people %}
        <option value="{{ person.id }}">{{ person.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="button" class="filter-mine" :aria-pressed="mine.toString()" :disabled="!me"
          @click="mine = !mine">
    Assigned to me
  </button>
</div>
