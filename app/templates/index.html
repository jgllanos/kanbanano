{% extends "base.html" %}

{% block body %}
<header class="topbar">
  <a href="/" class="brand">Kanbanano</a>
  {# Only on this page. Sessions last a year, so it's rarely needed. #}
  <form class="logout" method="post" action="/logout">
    <button type="submit">Log out</button>
  </form>
</header>

<main class="board-index">
  <h1>Boards</h1>

  {# The server responds with an HX-Redirect to the new board. #}
  <form class="board-create" hx-post="/boards" hx-swap="none">
    <input type="text" name="title" required maxlength="100" autocomplete="off"
           placeholder="New board title" aria-label="New board title">
    <button type="submit" class="primary">Create board</button>
  </form>

  {% include "_board_tiles.html" %}
</main>
{% endblock %}
