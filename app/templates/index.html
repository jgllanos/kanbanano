{% extends "base.html" %}

{% block body %}
<header class="topbar">
  <a href="/" class="brand">Kanbanano</a>
</header>

<main class="board-index">
  <h1>Boards</h1>
  <ul class="board-tiles">
    {% for board in boards %}
      <li>
        <a class="board-tile" href="/boards/{{ board.id }}" style="background: {{ board.background }}">
          {{ board.title }}
        </a>
      </li>
    {% else %}
      <li class="empty">No boards yet. Run <code>uv run seed.py</code> to add sample data.</li>
    {% endfor %}
  </ul>
</main>
{% endblock %}
