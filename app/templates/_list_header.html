{# A list's heading (also its drag handle), rename field and delete button. A
   rename re-renders this block, so Escape reverts to the saved title. #}
<div class="list-header">
  <h2 class="list-title" x-show="!renaming" title="Rename list"
      @click="renaming = true; $nextTick(() => $refs.listTitle.select())">{{ list.title }}</h2>

  {# Saves on change, so nothing is sent if the title wasn't edited or Escape
     reverted it. #}
  <form class="list-rename" x-show="renaming" x-cloak
        hx-patch="/lists/{{ list.id }}" hx-trigger="change"
        hx-target="closest .list-header" hx-swap="outerHTML">
    <input name="title" x-ref="listTitle" value="{{ list.title }}" required maxlength="100"
           aria-label="List title" autocomplete="off"
           @keydown.enter.prevent="$el.blur()"
           @keydown.escape.prevent="$el.value = $el.defaultValue; $el.blur()"
           @blur="renaming = false">
  </form>

  <button type="button" class="list-delete" aria-label="Delete list"
          hx-delete="/lists/{{ list.id }}" hx-target="closest .list" hx-swap="delete"
          hx-confirm="Delete this list and all its cards? This can't be undone.">✕</button>
</div>
