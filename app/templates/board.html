{% extends "base.html" %}

{% block title %}{{ board.title }} · Kanbanano{% endblock %}

{% block body %}
{# The background color is set by a <style> in the settings menu (_board_menu.html). #}
<div class="board-page">
  {% include "_board_header.html" %}

  {# Polls replace #lists-container and #board-header, so keep other UI state
     outside them. The lists panel is outside both. It sits beside the board,
     and only the board scrolls sideways. #}
  <div class="board-body">
    {% include "_list_rail.html" %}
    {% include "_lists.html" %}
  </div>
</div>

{# Polls every 3s for changes. app.js triggers `refresh` to poll immediately once
   a delayed refresh is safe (see "Polling" in app.js). #}
<div id="board-poller" hidden
     hx-get="/boards/{{ board.id }}/poll" hx-vals="js:{v: boardVersion()}"
     hx-trigger="every 3s [pollAllowed()], refresh"
     hx-target="#lists-container" hx-swap="outerHTML"></div>

<div id="modal-root"></div>
{% endblock %}
