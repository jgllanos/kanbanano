{# The card modal's checklist. Writes only replace _checklist_body.html, so the
   add-item form keeps focus between items. #}
<section class="checklist" x-data="checklistAdd">
  {% include "_checklist_body.html" %}

  <form class="checklist-add" x-ref="form"
        hx-post="/cards/{{ card.id }}/checklist" hx-target="#checklist-body" hx-swap="outerHTML">
    <input type="text" name="text" x-ref="text" required maxlength="200" autocomplete="off"
           placeholder="Add an item" aria-label="New checklist item">
    <button type="submit" class="primary">Add</button>
  </form>
</section>
